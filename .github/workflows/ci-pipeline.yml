name: NexusAI Omni-Modal Hub CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # JOB 1: High-Performance C++ Core Compilation Check
  build-cpp-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install Build Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Compile C++ Binary Node
        run: |
          cd core_engines/audio-processor-cpp
          mkdir -p build && cd build
          cmake ..
          make

  # JOB 2: Java Spring Boot Backend Build & Verify
  build-java-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java JDK Environment
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Package Maven Artifact
        run: |
          cd core_engines/gateway-service-java
          mvn -B clean package -DskipTests

  # JOB 3: Python AI Layer Linting & Evaluation Suite Check
  verify-ai-orchestration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Core AI Package Matrix
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Syntax and Code Quality Lint Checks
        run: |
          python -m py_compile ai_orchestrator/agents/graph.py
          python -m py_compile ai_orchestrator/knowledge/rag_pipeline.py
          python -m py_compile ai_orchestrator/models/recsys_engine.py

      - name: Run Comprehensive System Testing Matrix
        env:
          OLLAMA_BASE_URL: "mock://localhost"
        run: |
          python -m unittest tests/unit/test_nexus_system_wide.py

      - name: Run Prompt Regression Guardrails Matrix
        env:
          MLFLOW_TRACKING_URI: "file:./mlruns"
          OLLAMA_BASE_URL: "mock://localhost"
        run: |
          python tests/unit/ai_eval_suite.py

  # JOB 4: Automated Docker Container Mesh Build Verification
  container-build-mesh:
    needs: [build-cpp-core, build-java-gateway, verify-ai-orchestration]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Mock Java Artifact Target for Image Assembly
        run: |
          mkdir -p core_engines/gateway-service-java/target
          touch core_engines/gateway-service-java/target/gateway-service-1.0.0.jar

      - name: Setup Docker Buildx Core
        uses: docker/setup-buildx-action@v3

      - name: Validate C++ Docker Container Assembly
        uses: docker/build-push-action@v5
        with:
          context: ./core_engines/audio-processor-cpp
          push: false
          tags: nexus-audio-processor:latest

      - name: Validate Java Docker Container Assembly
        uses: docker/build-push-action@v5
        with:
          context: ./core_engines/gateway-service-java
          push: false
          tags: nexus-java-gateway:latest

      - name: Validate Python Orchestrator Docker Assembly
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.python
          push: false
          tags: nexus-python-orchestrator:latest

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"
  MLFLOW_DISABLE_TELEMETRY: "true"

jobs:
  python:
    name: Python - lint, unit tests, evaluation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check ai_orchestrator evals tests scripts data_pipeline ui_analytics
      - run: python -m pytest
      - name: Offline evaluation and quality gate (fails the build on regression)
        run: python -m evals.run_evals --profile offline --gate --report reports/eval_offline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: reports/eval_offline.json

  java:
    name: Java gateway - unit, RBAC and Testcontainers tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B verify
        working-directory: core_engines/gateway-service-java

  cpp:
    name: C++ audio processor - Release build with whisper.cpp, ctest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - uses: actions/cache@v4
        with:
          path: core_engines/audio-processor-cpp/build/_deps
          key: whisper-v1.9.5-${{ runner.os }}
      - run: |
          cmake -S core_engines/audio-processor-cpp -B core_engines/audio-processor-cpp/build \
                -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          cmake --build core_engines/audio-processor-cpp/build -j "$(nproc)"
          ctest --test-dir core_engines/audio-processor-cpp/build --output-on-failure

  pipeline:
    name: Data pipeline - Perl, Spark, data-quality gates, PII recall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-pipeline.txt
      - run: perl -c data_pipeline/scripts/parser.pl
      - name: Run the pipeline on 20k synthetic lines (exits 1 if a DQ check fails)
        env:
          NEXUS_DATA_DIR: ${{ runner.temp }}/nexus-data
          LINES: "20000"
          REGENERATE: "1"
        run: bash data_pipeline/run_pipeline.sh

  images:
    name: Container images build
    needs: [python, java, cpp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., file: Dockerfile.python, target: app, push: false, tags: "nexus/python:ci",
               cache-from: type=gha, cache-to: "type=gha,mode=max"}
      - uses: docker/build-push-action@v6
        with: {context: core_engines/gateway-service-java, push: false, tags: "nexus/gateway:ci",
               cache-from: type=gha, cache-to: "type=gha,mode=max"}
      - uses: docker/build-push-action@v6
        with: {context: core_engines/audio-processor-cpp, push: false, tags: "nexus/audio-processor:ci",
               cache-from: type=gha, cache-to: "type=gha,mode=max"}

  kubernetes:
    name: Kubernetes manifests - render and schema-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render with kustomize and validate with kubeconform
        run: |
          cp local_infra/k8s/secrets.env.example local_infra/k8s/secrets.env
          kubectl kustomize local_infra/k8s > rendered.yaml
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary rendered.yaml

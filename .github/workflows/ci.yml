name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"
  MLFLOW_DISABLE_TELEMETRY: "true"
  # NLTK >= 3.10.4 refuses data directories other users can write to, and the runner's site-packages
  # (where LlamaIndex bundles its NLTK data) is group-writable. Use a private directory instead.
  NLTK_DATA: ${{ github.workspace }}/../nltk_data

jobs:
  python:
    name: Python - lint, unit tests, evaluation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Fetch NLTK data into the private NLTK_DATA directory
        run: python -c "import nltk, os; [nltk.download(p, download_dir=os.environ['NLTK_DATA'], quiet=True, raise_on_error=True) for p in ('stopwords', 'punkt_tab')]"
      - run: ruff check ai_orchestrator evals tests scripts data_pipeline ui_analytics
      - run: python -m pytest
      - name: Offline evaluation and quality gate (fails the build on regression)
        run: python -m evals.run_evals --profile offline --gate --report reports/eval_offline.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: eval-report
          path: reports/eval_offline.json

  java:
    name: Java gateway - unit, RBAC and Testcontainers tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B verify
        working-directory: core_engines/gateway-service-java

  cpp:
    name: C++ audio processor - Release build with whisper.cpp, ctest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: core_engines/audio-processor-cpp/build/_deps
          key: whisper-v1.9.5-${{ runner.os }}
      - run: |
          cmake -S core_engines/audio-processor-cpp -B core_engines/audio-processor-cpp/build \
                -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          cmake --build core_engines/audio-processor-cpp/build -j "$(nproc)"
          ctest --test-dir core_engines/audio-processor-cpp/build --output-on-failure

  pipeline:
    name: Data pipeline - Perl, Spark, data-quality gates, PII recall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-pipeline.txt
      - run: perl -c data_pipeline/scripts/parser.pl
      - name: Run the pipeline on 20k synthetic lines (exits 1 if a DQ check fails)
        env:
          NEXUS_DATA_DIR: ${{ runner.temp }}/nexus-data
          LINES: "20000"
          REGENERATE: "1"
        run: bash data_pipeline/run_pipeline.sh

  images:
    name: Container images build
    needs: [python, java, cpp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with: {context: ., file: Dockerfile.python, target: app, push: false, tags: "nexus/python:ci",
               cache-from: type=gha, cache-to: "type=gha,mode=max"}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with: {context: core_engines/gateway-service-java, push: false, tags: "nexus/gateway:ci",
               cache-from: type=gha, cache-to: "type=gha,mode=max"}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with: {context: core_engines/audio-processor-cpp, push: false, tags: "nexus/audio-processor:ci",
               cache-from: type=gha, cache-to: "type=gha,mode=max"}

  kubernetes:
    name: Kubernetes manifests - render and schema-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Render with kustomize and validate with kubeconform
        run: |
          cp local_infra/k8s/secrets.env.example local_infra/k8s/secrets.env
          kubectl kustomize local_infra/k8s > rendered.yaml
          curl -fsSLO https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          # sha256 from the v0.6.7 release CHECKSUMS file
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform
          ./kubeconform -strict -summary rendered.yaml

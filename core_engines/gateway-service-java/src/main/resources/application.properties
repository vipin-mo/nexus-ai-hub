spring.application.name=gateway-service
server.port=8080

# PostgreSQL Connection Matrix defaulting to your docker network service name
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:5432/nexus_operational
spring.datasource.username=nexus_admin
spring.datasource.password=nexus_secure_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Custom variable extraction layer routing defaults directly to the orchestration container handle
nexus.orchestrator.ws-uri=ws://${ORCHESTRATOR_HOST:python-orchestrator}:8765

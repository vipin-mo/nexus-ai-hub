spring.application.name=gateway-service
server.port=8080

# PostgreSQL Connection Matrix targeting the running container mesh configurations
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/nexus_operational
spring.datasource.username=nexus_admin
spring.datasource.password=nexus_secure_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Custom variable extraction layer for decoupled service bindings
nexus.orchestrator.ws-uri=ws://${ORCHESTRATOR_HOST:localhost}:8765

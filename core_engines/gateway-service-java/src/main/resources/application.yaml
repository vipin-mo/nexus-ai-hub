spring:
  application:
    name: gateway-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:nexus_operational}
    username: ${POSTGRES_USER:nexus_admin}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway migrations
  threads:
    virtual:
      enabled: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true             # /actuator/health/liveness and /readiness for Kubernetes

nexus:
  orchestrator:
    # NEXUS_ prefix: Kubernetes injects ORCHESTRATOR_PORT=tcp://... for a Service named orchestrator
    ws-uri: ws://${ORCHESTRATOR_HOST:localhost}:${NEXUS_ORCHESTRATOR_PORT:8765}
    internal-token: ${NEXUS_INTERNAL_TOKEN:}
    timeout: 135s                 # longer than the orchestrator's own 120 s deadline
  max-inflight: ${NEXUS_GATEWAY_MAX_INFLIGHT:32}
  clients:                        # bootstrapped into api_clients on startup (hash only)
    admin-key: ${NEXUS_ADMIN_API_KEY:}
    analyst-key: ${NEXUS_ANALYST_API_KEY:}
    ingest-key: ${NEXUS_INGEST_API_KEY:}

# Quality gate. Each key is <suite>.<metric>; a "_max" suffix means "must not exceed".
# Thresholds sit a little below the measured baseline (see BENCHMARKS.md) so normal noise
# passes and real regressions fail. Raise them when a change improves the baseline.

offline:            # CI: fake LLM, hashing embeddings, rules-only security - deterministic
  retrieval.hybrid_hit_at_3: 0.85        # measured 0.893
  retrieval.sparse_hit_at_3: 0.90        # measured 0.964
  routing.classifier_accuracy: 0.83      # measured 0.867
  security.rules_recall: 0.85            # measured 0.879
  security.rules_false_positive_rate_max: 0.05   # measured 0.000
  recommendation.top1_accuracy: 0.80     # measured 0.846
  recommendation.top3_accuracy: 0.90     # measured 0.923
  recommendation.role_violations_max: 0
  recommendation.offline_cf_hit_at_1: 0.80       # measured 0.878 (popularity baseline 0.392)
  answers.retrieved_expected_source: 0.85        # measured 0.893

local:              # Ollama: llama3:8b scanner/router fallback, qwen2.5:3b answers, nomic embeddings
  retrieval.hybrid_hit_at_3: 0.92        # measured 0.964
  routing.final_accuracy: 0.86           # measured 0.917 (classifier + LLM fallback)
  security.full_recall: 0.93             # measured 0.970
  security.full_false_positive_rate_max: 0.05    # measured 0.000
  recommendation.top1_accuracy: 0.80     # measured 0.846
  recommendation.role_violations_max: 0
  answers.fact_recall: 0.85              # measured 0.938
  answers.retrieved_expected_source: 0.90        # measured 0.964
  answers.cites_expected_source: 0.40    # measured 0.536
  answers.groundedness: 0.90             # measured 0.975 (llama3 judge; only with --judge)
  answers.refuses_unanswerable: 0.75     # measured 0.75 (3 of 4 - small set, see BENCHMARKS.md)

cloud:              # same quality bar; Claude should meet or beat the local models
  security.full_recall: 0.93
  security.full_false_positive_rate_max: 0.05
  answers.fact_recall: 0.85
  answers.retrieved_expected_source: 0.90
  answers.cites_expected_source: 0.40
  answers.refuses_unanswerable: 0.75

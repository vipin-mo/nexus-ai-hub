apiVersion: v1
kind: Service
metadata: {name: dashboard}
spec:
  type: NodePort
  selector: {app: dashboard}
  ports: [{port: 8501, targetPort: 8501, nodePort: 30501}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: dashboard}
spec:
  replicas: 1
  selector: {matchLabels: {app: dashboard}}
  template:
    metadata: {labels: {app: dashboard}}
    spec:
      enableServiceLinks: false   # no docker-links env vars (ORCHESTRATOR_PORT=tcp://...)
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: dashboard
          image: nexus/python:latest
          imagePullPolicy: IfNotPresent
          command: ["streamlit", "run", "ui_analytics/app.py", "--server.address=0.0.0.0", "--server.port=8501",
                    "--server.headless=true", "--browser.gatherUsageStats=false"]
          envFrom: [{configMapRef: {name: nexus-config}}]
          env:
            - {name: NEXUS_GATEWAY_URL, value: "http://gateway:8080"}
            - {name: NEXUS_ANALYST_API_KEY, valueFrom: {secretKeyRef: {name: nexus-secrets, key: NEXUS_ANALYST_API_KEY}}}
            - {name: NEXUS_ADMIN_API_KEY, valueFrom: {secretKeyRef: {name: nexus-secrets, key: NEXUS_ADMIN_API_KEY}}}
          ports: [{containerPort: 8501}]
          readinessProbe: {httpGet: {path: /_stcore/health, port: 8501}, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: nexus-data}}]

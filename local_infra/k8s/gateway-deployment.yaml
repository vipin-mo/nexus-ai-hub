apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway-container
          image: gateway-service:1.0.0
          imagePullPolicy: Never # Forces Kubernetes nodes to evaluate local compilation image targets natively
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/nexus_operational"
            - name: SPRING_DATASOURCE_USERNAME
              value: "nexus_admin"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "nexus_secure_password"
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: "org.postgresql.Driver"
            - name: ORCHESTRATOR_HOST
              value: "python-orchestrator-service" # Maps dynamically inside Java controllers to bind cluster web sockets
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080 # Exposes the enterprise routing entry points to network clients outside cluster frameworks
  selector:
    app: gateway

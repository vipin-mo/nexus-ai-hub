apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: nexus-data}
spec:
  accessModes: [ReadWriteOnce]   # single-node cluster: orchestrator, audio processor and dashboard share it
  resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: orchestrator}
spec:
  selector: {app: orchestrator}
  ports: [{port: 8765, targetPort: 8765}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: orchestrator}
spec:
  replicas: 1
  selector: {matchLabels: {app: orchestrator}}
  template:
    metadata: {labels: {app: orchestrator}}
    spec:
      enableServiceLinks: false   # no docker-links env vars (ORCHESTRATOR_PORT=tcp://...)
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: orchestrator
          image: nexus/python:latest
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: nexus-config}}]
          env:
            - {name: NEXUS_INTERNAL_TOKEN, valueFrom: {secretKeyRef: {name: nexus-secrets, key: NEXUS_INTERNAL_TOKEN}}}
            - {name: ANTHROPIC_API_KEY, valueFrom: {secretKeyRef: {name: nexus-secrets, key: ANTHROPIC_API_KEY}}}
            - {name: MONGO_USER, valueFrom: {secretKeyRef: {name: nexus-secrets, key: MONGO_USER}}}
            - {name: MONGO_PASSWORD, valueFrom: {secretKeyRef: {name: nexus-secrets, key: MONGO_PASSWORD}}}
            - {name: MONGO_URI, value: "mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@mongodb:27017/?authSource=admin"}
          ports: [{containerPort: 8765}]
          startupProbe: {httpGet: {path: /healthz, port: 8765}, periodSeconds: 5, failureThreshold: 36}
          readinessProbe: {httpGet: {path: /healthz, port: 8765}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: 8765}, periodSeconds: 20}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: nexus-data}}]

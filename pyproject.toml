[project]
name = "nexus-ai-hub"
version = "0.2.0"
description = "Multi-language AI operations hub: LangGraph agent, hybrid RAG, MLOps, C++ speech ingestion, Java RBAC gateway"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", ".venv.old", "data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "S607"]
